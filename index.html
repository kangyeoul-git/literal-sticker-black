<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Literal Sticker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background-color: #000000; color: #ffffff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; }
        .mirror { transform: scaleX(-1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback } = React;

        const App = () => {
            const [view, setView] = useState('intro'); // 'intro' or 'camera'
            
            if (view === 'intro') {
                return (
                    <div className="h-screen flex items-center justify-center bg-black cursor-pointer" onClick={() => setView('camera')}>
                        <h1 className="text-7xl font-black tracking-tighter hover:scale-105 transition-transform text-center">
                            LITERAL<br/>STICKER
                        </h1>
                    </div>
                );
            }

            return <CameraView />;
        };

        const CameraView = () => {
            const videoRef = useRef(null);
            const [isCounting, setIsCounting] = useState(false);
            const [count, setCount] = useState(3);

            useEffect(() => {
                const initCamera = async () => {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', aspectRatio: 1 } });
                        if (videoRef.current) videoRef.current.srcObject = stream;
                    } catch (err) {
                        alert("카메라 권한을 허용해주세요.");
                    }
                };
                initCamera();
            }, []);

            const startCountdown = () => {
                setIsCounting(true);
                let timer = 3;
                const interval = setInterval(() => {
                    timer -= 1;
                    setCount(timer);
                    if (timer === 0) {
                        clearInterval(interval);
                        // 여기서 실제 촬영 로직 실행
                        alert("찰칵! 블랙 배경 스티커를 생성합니다.");
                        setIsCounting(false);
                        setCount(3);
                    }
                }, 1000);
            };

            return (
                <div className="h-screen flex flex-col items-center justify-center p-4">
                    <div className="relative w-80 h-80 md:w-[450px] md:h-[450px] bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-800 shadow-2xl">
                        <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover mirror" />
                        
                        {isCounting && (
                            <div className="absolute inset-0 flex items-center justify-center bg-black/40 backdrop-blur-sm">
                                <span className="text-9xl font-black text-white">{count}</span>
                            </div>
                        )}
                    </div>

                    {!isCounting && (
                        <button onClick={startCountdown} className="mt-12 group relative flex items-center justify-center">
                            <div className="w-20 h-20 rounded-full border-4 border-white transition-transform group-hover:scale-110" />
                            <div className="absolute w-16 h-16 bg-white rounded-full transition-all group-active:scale-90" />
                        </button>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
